name: Android cloud build and unit tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read

# A new push supersedes older builds of the same branch. PR checks retain
# separate groups so independent feature branches never cancel each other.
# Keep the latest main CI as an explicit release verification gate.
concurrency:
  group: habitflow-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK and install API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          test -f "$SDK/platforms/android-36/android.jar"
      - name: Gradle build and unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug testDebugUnitTest
      - name: Upload debug APK
        if: success()
        id: upload_debug_apk
        uses: actions/upload-artifact@v4
        with:
          name: habitflow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
      # Make the downloadable app visible directly on each workflow run's
      # Summary tab. The URL is emitted by upload-artifact@v4 for this run.
      - name: Show debug APK download link
        if: success()
        env:
          APK_ARTIFACT_URL: ${{ steps.upload_debug_apk.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APK_ARTIFACT_URL"
          {
            echo '## 📱 HabitFlow debug APK'
            echo
            echo "[Download this run's APK artifact]($APK_ARTIFACT_URL)"
            echo
            echo "Build commit: \`$GITHUB_SHA\`"
            echo 'This is an unsigned-for-release debug build, not a Play Store release.'
            echo 'GitHub downloads the artifact as a ZIP; extract the .apk to install.'
            echo 'The download is retained for 14 days and may require GitHub sign-in.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore
