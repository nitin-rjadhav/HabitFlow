name: Android emulator smoke tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: habitflow-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=systemd", TAG+="uaccess"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preinstall emulator system image with retries
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          IMAGE="system-images;android-35;google_apis;x86_64"
          for attempt in 1 2 3; do
            echo "System image installation attempt $attempt/3"
            if "$SDKMANAGER" --install "$IMAGE" && test -f "$SDK/system-images/android-35/google_apis/x86_64/system.img"; then
              exit 0
            fi
            sudo rm -rf "$SDK/system-images/android-35/google_apis/x86_64"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android emulator system image installation failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Install and test APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Avoid repeated Pixel Launcher ANRs on cold boot under constrained memory.
          cores: 4
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash -x scripts/emulator-smoke.sh
      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p emulator-evidence
          timeout --signal=TERM --kill-after=5s 15s adb logcat -d -t 1500 > emulator-evidence/logcat-final.txt 2>/dev/null || true
          echo "Diagnostics collection finished (ADB bounded to 15 seconds)"
      - name: Upload screenshots, logs, and instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habitflow-emulator-evidence
          path: |
            emulator-evidence/**
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
          if-no-files-found: ignore
          retention-days: 7
