name: Android emulator smoke tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=systemd", TAG+="uaccess"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            mkdir -p emulator-evidence
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug
            APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
            test -n "$APK"
            adb install -r "$APK"
            PACKAGE=$(aapt dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
            test -n "$PACKAGE"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof "$PACKAGE" > emulator-evidence/app-pid.txt
            adb shell screencap -p /sdcard/habitflow-smoke.png
            adb pull /sdcard/habitflow-smoke.png emulator-evidence/launch.png
            adb logcat -d -t 1500 > emulator-evidence/logcat.txt
            echo "Launch smoke check passed" | tee emulator-evidence/launch-result.txt
            # Database instrumentation tests completed in the first run.
            timeout --signal=TERM --kill-after=30s 10m ./gradlew --no-daemon :core-database:connectedDebugAndroidTest
            # Upstream Compose instrumentation stalled at 0/3. Bound its runtime.
            timeout --signal=TERM --kill-after=30s 8m ./gradlew --no-daemon :feature-dashboard:connectedDebugAndroidTest
            echo "Installed and launched $PACKAGE" | tee emulator-evidence/result.txt
      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p emulator-evidence
          adb logcat -d -t 1500 > emulator-evidence/logcat-final.txt 2>/dev/null || true
      - name: Upload screenshots, logs, and instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habitflow-emulator-evidence
          path: |
            emulator-evidence/**
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
          if-no-files-found: ignore
          retention-days: 7
